version: "3.9"

services:
  app:
    build: .
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-changeme}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:root@database:3306/crypto_portfolio?serverVersion=10.4.32-MariaDB&charset=utf8mb4}
    volumes:
      - .:/var/www/html
    depends_on:
      - database

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  database:
    image: mariadb:10.4
    environment:
      MYSQL_DATABASE: crypto_portfolio
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
